<text x="248" y="220.2" text-anchor="end" font-size="12" font-weight="500" fill="#374151">3. Metric Aggregation (/logs/trend hourly)</text>
<rect x="260.0" y="204.2" width="4.0" height="24" fill="#818cf8" rx="3" opacity="0.9"/>
<text x="272.0" y="220.2" font-size="11.5" font-weight="600" fill="#4338ca">2.5 QPS (P50: 8482.8ms)</text>
<text x="248" y="282.8" text-anchor="end" font-size="12" font-weight="500" fill="#374151">4. Retention Analysis (SQL self-join pushdown)</text>
