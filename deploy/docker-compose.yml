services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_USER: logtap
      POSTGRES_PASSWORD: logtap
      POSTGRES_DB: logtap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nsqlookupd:
    image: nsqio/nsq:v1.2.1
    command: /nsqlookupd
    ports:
      - "4160:4160"
      - "4161:4161"

  nsqd:
    image: nsqio/nsq:v1.2.1
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd --max-msg-size=26214400
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150"
      - "4151:4151"

  nsqadmin:
    image: nsqio/nsq:v1.2.1
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
    ports:
      - "4171:4171"

  logtap:
    image: crpi-r5fi5bvqffhj53r3.cn-hangzhou.personal.cr.aliyuncs.com/lovetalk/logtap
    build:
      context: ..
      dockerfile: logtap/Dockerfile
      args:
        MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY}"
    environment:
      NSQD_ADDRESS: "nsqd:4150"
      NSQD_HTTP_ADDRESS: "nsqd:4151"
      POSTGRES_URL: "postgres://logtap:logtap@postgres:5432/logtap?sslmode=disable"
      DB_REQUIRE_TIMESCALE: "true"
      RUN_CONSUMERS: "true"
      # Required: base64 secret (decoded length >= 32 bytes).
      # Generate: `task auth:secret` (run in repo `logtap/`).
      AUTH_SECRET: "${AUTH_SECRET}"
      LOGTAP_CLOUD_URL: "${LOGTAP_CLOUD_URL:-https://logtap.hivescale.net}"
      # Optional: GeoLite2 mmdb download (recommended for distribution/analytics with GeoIP).
      MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY}"
      GEOIP_DIR: "/data/geoip"
    depends_on:
      - postgres
      - nsqd
    ports:
      - "8080:8080"
    volumes:
      - geoip:/data/geoip
    # ClickHouse storage backend (opt-in, see docs/CLICKHOUSE_STORAGE_DESIGN.md).
    # Start it with: docker compose --profile clickhouse up -d
    # Then uncomment to switch the gateway to dual writing (reads stay on PG
    # until the read cutover):
    #   STORAGE_BACKEND: "dual"
    #   CLICKHOUSE_DSN: "clickhouse://logtap:clickhouse@clickhouse:9000/logtap?dial_timeout=5s"
    #   # CH_DEDUP_MODE: "redis"        # default; requires REDIS_ADDR
    #   # CH_ENABLE_SIDECARS: "false"   # true only when PG data consumers are off

  # ClickHouse 26.3 LTS single node for development and evaluation only.
  # Production must run the stage-B baseline (1 shard x 2 replicas + Keeper).
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_USER: "logtap"
      CLICKHOUSE_PASSWORD: "clickhouse"
      CLICKHOUSE_DB: "logtap"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse

volumes:
  pgdata: {}
  geoip: {}
  chdata: {}
